<!-- ion-split-pane divide automáticamente sidebar + contenido en tablet/desktop -->
<ion-split-pane contentId="legal-content" when="md">

  <!-- SIDEBAR -->
  <ion-menu contentId="legal-content" menuId="legal-menu">
    <ion-header>
      <ion-toolbar>
        <ion-title>Legal</ion-title>
      </ion-toolbar>
    </ion-header>
    <ion-content>
      <ion-list lines="none">
        @for (section of sections; track section.id) {
          <ion-item
            button
            [class.active-item]="active?.id === section.id"
            (click)="select(section)"
          >
            <ion-label>{{ section.title }}</ion-label>
          </ion-item>
        }
      </ion-list>
    </ion-content>
  </ion-menu>

  <!-- CONTENIDO PRINCIPAL -->
  <div id="legal-content">
    <ion-header>
      <ion-toolbar>
        <!-- Botón hamburguesa (solo visible en móvil) -->
        <ion-buttons slot="start">
          <ion-menu-button></ion-menu-button>
        </ion-buttons>
        <ion-title>{{ active?.title ?? 'Legal' }}</ion-title>
      </ion-toolbar>
    </ion-header>

    <ion-content class="legal-content ion-padding">
      @if (loading) {
        <p class="legal-status">Cargando...</p>
      } @else if (error) {
        <p class="legal-status">Error al cargar el contenido.</p>
      } @else if (active) {
        <h1 class="legal-title">{{ active.title }}</h1>
        <div class="legal-text" [innerHTML]="active.content"></div>
      }
    </ion-content>
  </div>

</ion-split-pane>
